<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1560" width="1450" height="1560">
<defs><filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2b2620" flood-opacity="0.15"/></filter><filter id="sh-lg" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#2b2620" flood-opacity="0.2"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c5347"/></marker></defs>
<rect width="1450" height="1560" fill="#faf7f0"/>
<line x1="433.2" y1="325.0" x2="602.8" y2="480.0" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="465.0" y="358.5" width="186.0" height="38" rx="19" fill="#faf7f0" stroke="#e3dccb"/><text x="558.0" y="384.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-weight="500">작은 예외가 습관화된다</text>
<line x1="280.0" y1="325.0" x2="280.0" y2="875.0" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="180.5" y="676.0" width="199.0" height="38" rx="19" fill="#faf7f0" stroke="#e3dccb"/><text x="280.0" y="702.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-weight="500">예외 없는 규칙과 상보적</text>
<line x1="877.9" y1="480.0" x2="1095.0" y2="267.5" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="933.9" y="324.8" width="225.0" height="38" rx="19" fill="#faf7f0" stroke="#e3dccb"/><text x="1046.4" y="350.8" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-weight="500">핑계로 불확실성을 선제 종료</text>
<line x1="893.6" y1="740.0" x2="1087.9" y2="910.0" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="944.7" y="836.0" width="212.0" height="38" rx="19" fill="#faf7f0" stroke="#e3dccb"/><text x="1050.7" y="862.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-weight="500">체계적 원인 분석이 필요함</text>
<path d="M 745.0 740.0 C 675.0 966.0, 675.0 1163.8, 745.0 1305.0" fill="none" stroke="#8a3b2b" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="529.5" y="1003.5" width="251.0" height="38" rx="19" fill="#faf7f0" stroke="#e3dccb"/><text x="655.0" y="1029.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#8a3b2b" font-weight="500">개인 책임 vs 사회적 불공정성</text>
<g filter="url(#sh)"><rect x="85.0" y="45.0" width="390" height="280" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g><text x="280" y="185" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="21" fill="#2f4a63" font-weight="600"><tspan x="280" y="113.6">예외를 허용하면</tspan><tspan x="280" y="143.4">소진된 의지력이</tspan><tspan x="280" y="173.2">편한 쪽으로</tspan><tspan x="280" y="203.1">결정을 유도하므로</tspan><tspan x="280" y="232.9">예외 자체를</tspan><tspan x="280" y="262.7">차단해야 한다</tspan></text><text x="280" y="357.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-style="italic">자기계발 - 의지력</text>
<g filter="url(#sh)"><rect x="95.0" y="875.0" width="370" height="250" rx="20" fill="#faeae3" stroke="#b9694f" stroke-width="2"/></g><text x="280" y="1000" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="21" fill="#8a3b2b" font-weight="600"><tspan x="280" y="928.6">관심없는 의무적인</tspan><tspan x="280" y="958.4">일은 목표 없이</tspan><tspan x="280" y="988.2">꾸준함만 유지해야</tspan><tspan x="280" y="1018.1">의무감으로 인한</tspan><tspan x="280" y="1047.9">포기를 막을 수</tspan><tspan x="280" y="1077.7">있다</tspan></text><text x="280" y="1157.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-style="italic">자기계발 - 습관</text>
<g filter="url(#sh)"><rect x="1025.0" y="42.5" width="370" height="225" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g><text x="1210" y="155" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="21" fill="#2f4a63" font-weight="600"><tspan x="1210" y="98.5">자이가르닉 효과는</tspan><tspan x="1210" y="128.3">완료하지 못한</tspan><tspan x="1210" y="158.2">일을 뇌가 더</tspan><tspan x="1210" y="188.0">강하게 기억하게</tspan><tspan x="1210" y="217.8">만드는 현상이다</tspan></text><text x="1210" y="299.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-style="italic">심리학 - 인지</text>
<g filter="url(#sh)"><rect x="1040.0" y="910.0" width="370" height="240" rx="20" fill="#faeae3" stroke="#b9694f" stroke-width="2"/></g><text x="1225" y="1030" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="21" fill="#8a3b2b" font-weight="600"><tspan x="1225" y="973.5">스트레스는 상황</tspan><tspan x="1225" y="1003.3">파악·해결방안</tspan><tspan x="1225" y="1033.2">탐색·실행이라는</tspan><tspan x="1225" y="1063.0">3단계로 다스릴</tspan><tspan x="1225" y="1092.8">수 있다</tspan></text><text x="1225" y="1182.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-style="italic">심리학 - 상담</text>
<g filter="url(#sh)"><rect x="530.0" y="1305.0" width="430" height="210" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g><text x="745" y="1410" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="21" fill="#2f4a63" font-weight="600"><tspan x="745" y="1368.4">롤스의 정의론은</tspan><tspan x="745" y="1398.2">능력주의적 태도와</tspan><tspan x="745" y="1428.1">구빈법적 사고를</tspan><tspan x="745" y="1457.9">극복하지 못한다</tspan></text><text x="745" y="1547.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-style="italic">정치철학 - 완전히 다른 영역</text>
<g filter="url(#sh-lg)"><rect x="530.0" y="480.0" width="430" height="260" rx="20" fill="#ffffff" stroke="#4d6f92" stroke-width="2"/></g><text x="745" y="610" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="25" fill="#2f4a63" font-weight="700"><tspan x="745" y="525.0">셀프 핸디캐핑은</tspan><tspan x="745" y="560.5">실패를 미리</tspan><tspan x="745" y="596.0">정당화하기 위해</tspan><tspan x="745" y="631.5">스스로 불리한</tspan><tspan x="745" y="667.0">상황을 만드는</tspan><tspan x="745" y="702.5">심리다</tspan></text><text x="745" y="772.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-style="italic">심리학 - 방어기제</text>
<circle cx="98" cy="64" r="12" fill="#4d6f92"/><text x="124" y="72" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#5c5347">문헌노트</text>
<circle cx="320" cy="64" r="12" fill="#b9694f"/><text x="346" y="72" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#5c5347">영구노트</text>
</svg>