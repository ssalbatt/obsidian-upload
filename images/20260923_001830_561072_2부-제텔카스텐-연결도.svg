<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 900" width="1220" height="900">
<defs>
  <filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2b2620" flood-opacity="0.15"/></filter>
  <filter id="sh-lg" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#2b2620" flood-opacity="0.2"/></filter>
  <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c5347"/></marker>
</defs>
<rect width="1220" height="900" fill="#faf7f0"/>
<line x1="380.0" y1="273.0" x2="503.8" y2="345.0" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="389.1" y="298.0" width="105.6" height="22" rx="11" fill="#faf7f0" stroke="#e3dccb"/><text x="441.9" y="313.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#5c5347" font-weight="500">작은 예외가 습관화된다</text>
<line x1="220.0" y1="275.0" x2="220.0" y2="605.0" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="163.6" y="429.0" width="112.9" height="22" rx="11" fill="#faf7f0" stroke="#e3dccb"/><text x="220.0" y="444.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#5c5347" font-weight="500">예외 없는 규칙과 상보적</text>
<line x1="756.2" y1="345.0" x2="906.2" y2="225.0" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="767.5" y="274.0" width="127.5" height="22" rx="11" fill="#faf7f0" stroke="#e3dccb"/><text x="831.2" y="289.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#5c5347" font-weight="500">핑계로 불확실성을 선제 종료</text>
<line x1="752.6" y1="515.0" x2="903.4" y2="640.0" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="767.9" y="566.5" width="120.2" height="22" rx="11" fill="#faf7f0" stroke="#e3dccb"/><text x="828.0" y="581.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#5c5347" font-weight="500">체계적 원인 분석이 필요함</text>

  <g filter="url(#sh)"><rect x="60.0" y="85.0" width="320" height="190" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g>
  <text x="220" y="180" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="13.5" fill="#2f4a63" font-weight="600"><tspan x="220" y="153.3">예외를 허용하면 소진된</tspan><tspan x="220" y="172.4">의지력이 편한 쪽으로</tspan><tspan x="220" y="191.6">결정을 유도하므로 예외</tspan><tspan x="220" y="210.8">자체를 차단해야 한다</tspan></text>

  <g filter="url(#sh)"><rect x="70.0" y="605.0" width="300" height="170" rx="20" fill="#faeae3" stroke="#b9694f" stroke-width="2"/></g>
  <text x="220" y="690" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="13.5" fill="#8a3b2b" font-weight="600"><tspan x="220" y="663.3">관심없는 의무적인 일은</tspan><tspan x="220" y="682.4">목표 없이 꾸준함만</tspan><tspan x="220" y="701.6">유지해야 의무감으로 인한</tspan><tspan x="220" y="720.8">포기를 막을 수 있다</tspan></text>

  <g filter="url(#sh)"><rect x="850.0" y="75.0" width="300" height="150" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g>
  <text x="1000" y="150" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="13.5" fill="#2f4a63" font-weight="600"><tspan x="1000" y="123.3">자이가르닉 효과는</tspan><tspan x="1000" y="142.4">완료하지 못한 일을 뇌가</tspan><tspan x="1000" y="161.6">더 강하게 기억하게</tspan><tspan x="1000" y="180.8">만드는 현상이다</tspan></text>

  <g filter="url(#sh)"><rect x="850.0" y="640.0" width="300" height="160" rx="20" fill="#faeae3" stroke="#b9694f" stroke-width="2"/></g>
  <text x="1000" y="720" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="13.5" fill="#8a3b2b" font-weight="600"><tspan x="1000" y="693.3">스트레스는 원인 파악과</tspan><tspan x="1000" y="712.4">해결책 실행이라는 3단계</tspan><tspan x="1000" y="731.6">확인 절차로 다스릴 수</tspan><tspan x="1000" y="750.8">있다</tspan></text>

  <g filter="url(#sh-lg)"><rect x="480.0" y="345.0" width="340" height="170" rx="20" fill="#ffffff" stroke="#4d6f92" stroke-width="2"/></g>
  <text x="650" y="430" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="15.5" fill="#2f4a63" font-weight="700"><tspan x="650" y="399.3">셀프 핸디캐핑은 실패를</tspan><tspan x="650" y="421.3">미리 정당화하기 위해</tspan><tspan x="650" y="443.3">스스로 불리한 상황을</tspan><tspan x="650" y="465.3">만드는 심리다</tspan></text>
<circle cx="60" cy="40" r="7" fill="#4d6f92"/><text x="76" y="45" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" fill="#5c5347">문헌노트</text>
<circle cx="190" cy="40" r="7" fill="#b9694f"/><text x="206" y="45" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" fill="#5c5347">영구노트</text>
</svg>