<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1290" width="1450" height="1290">
<defs><filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2b2620" flood-opacity="0.15"/></filter><filter id="sh-lg" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#2b2620" flood-opacity="0.2"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c5347"/></marker></defs>
<rect width="1450" height="1290" fill="#faf7f0"/>
<line x1="445.0" y1="269.4" x2="568.4" y2="337.5" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="445.1" y="290.4" width="123.2" height="26" rx="13" fill="#faf7f0" stroke="#e3dccb"/><text x="506.7" y="307.9" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#5c5347" font-weight="500">작은 예외가 습관화된다</text>
<line x1="265.0" y1="277.5" x2="265.0" y2="637.5" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="199.1" y="444.5" width="131.8" height="26" rx="13" fill="#faf7f0" stroke="#e3dccb"/><text x="265.0" y="462.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#5c5347" font-weight="500">예외 없는 규칙과 상보적</text>
<line x1="878.7" y1="337.5" x2="1050.0" y2="212.5" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="889.9" y="262.0" width="149.0" height="26" rx="13" fill="#faf7f0" stroke="#e3dccb"/><text x="964.4" y="279.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#5c5347" font-weight="500">핑계로 불확실성을 선제 종료</text>
<line x1="869.3" y1="532.5" x2="1067.0" y2="687.5" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="898.0" y="597.0" width="140.4" height="26" rx="13" fill="#faf7f0" stroke="#e3dccb"/><text x="968.2" y="614.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#5c5347" font-weight="500">체계적 원인 분석이 필요함</text>
<path d="M 745.0 532.5 C 675.0 730.5, 675.0 903.8, 745.0 1027.5" fill="none" stroke="#8a3b2b" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="571.9" y="767.0" width="166.2" height="26" rx="13" fill="#faf7f0" stroke="#e3dccb"/><text x="655.0" y="784.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#8a3b2b" font-weight="500">개인 책임 vs 사회적 불공정성</text>
<g filter="url(#sh)"><rect x="85.0" y="62.5" width="360" height="215" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g><text x="265" y="170" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="16" fill="#2f4a63" font-weight="600"><tspan x="265" y="138.3">예외를 허용하면 소진된</tspan><tspan x="265" y="161.0">의지력이 편한 쪽으로</tspan><tspan x="265" y="183.8">결정을 유도하므로 예외</tspan><tspan x="265" y="206.5">자체를 차단해야 한다</tspan></text>
<g filter="url(#sh)"><rect x="95.0" y="637.5" width="340" height="195" rx="20" fill="#faeae3" stroke="#b9694f" stroke-width="2"/></g><text x="265" y="735" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="16" fill="#8a3b2b" font-weight="600"><tspan x="265" y="692.0">관심없는 의무적인 일은</tspan><tspan x="265" y="714.7">목표 없이 꾸준함만</tspan><tspan x="265" y="737.4">유지해야 의무감으로</tspan><tspan x="265" y="760.1">인한 포기를 막을 수</tspan><tspan x="265" y="782.8">있다</tspan></text>
<g filter="url(#sh)"><rect x="1000.0" y="37.5" width="340" height="175" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g><text x="1170" y="125" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="16" fill="#2f4a63" font-weight="600"><tspan x="1170" y="82.0">자이가르닉 효과는</tspan><tspan x="1170" y="104.7">완료하지 못한 일을</tspan><tspan x="1170" y="127.4">뇌가 더 강하게</tspan><tspan x="1170" y="150.1">기억하게 만드는</tspan><tspan x="1170" y="172.8">현상이다</tspan></text>
<g filter="url(#sh)"><rect x="1015.0" y="687.5" width="340" height="185" rx="20" fill="#faeae3" stroke="#b9694f" stroke-width="2"/></g><text x="1185" y="780" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="16" fill="#8a3b2b" font-weight="600"><tspan x="1185" y="737.0">스트레스는 상황</tspan><tspan x="1185" y="759.7">파악·해결방안</tspan><tspan x="1185" y="782.4">탐색·실행이라는</tspan><tspan x="1185" y="805.1">3단계로 다스릴 수</tspan><tspan x="1185" y="827.8">있다</tspan></text>
<g filter="url(#sh)"><rect x="550.0" y="1027.5" width="390" height="175" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g><text x="745" y="1115" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="16" fill="#2f4a63" font-weight="600"><tspan x="745" y="1083.3">롤스의 정의론은</tspan><tspan x="745" y="1106.0">능력주의적 태도와</tspan><tspan x="745" y="1128.8">구빈법적 사고를 극복하지</tspan><tspan x="745" y="1151.5">못한다</tspan></text><text x="745" y="1224.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" fill="#5c5347" font-style="italic">정치철학 - 완전히 다른 영역</text>
<g filter="url(#sh-lg)"><rect x="550.0" y="337.5" width="390" height="195" rx="20" fill="#ffffff" stroke="#4d6f92" stroke-width="2"/></g><text x="745" y="435" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="18.5" fill="#2f4a63" font-weight="700"><tspan x="745" y="398.4">셀프 핸디캐핑은 실패를</tspan><tspan x="745" y="424.6">미리 정당화하기 위해</tspan><tspan x="745" y="450.9">스스로 불리한 상황을</tspan><tspan x="745" y="477.2">만드는 심리다</tspan></text>
<circle cx="66" cy="44" r="8" fill="#4d6f92"/><text x="84" y="49.5" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#5c5347">문헌노트</text>
<circle cx="215" cy="44" r="8" fill="#b9694f"/><text x="233" y="49.5" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" fill="#5c5347">영구노트</text>
</svg>