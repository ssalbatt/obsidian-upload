<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2175 1935" width="2175" height="1935">
<defs><filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2b2620" flood-opacity="0.15"/></filter><filter id="sh-lg" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#2b2620" flood-opacity="0.2"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c5347"/></marker></defs>
<rect width="2175" height="1935" fill="#faf7f0"/>
<line x1="668.0" y1="404.2" x2="853.0" y2="506.5" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="667.5" y="436.4" width="186.0" height="38" rx="19" fill="#faf7f0" stroke="#e3dccb"/><text x="760.5" y="462.4" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-weight="500">작은 예외가 습관화된다</text>
<line x1="398.0" y1="416.5" x2="398.0" y2="956.5" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="298.5" y="667.5" width="199.0" height="38" rx="19" fill="#faf7f0" stroke="#e3dccb"/><text x="398.0" y="693.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-weight="500">예외 없는 규칙과 상보적</text>
<line x1="1318.7" y1="506.5" x2="1574.9" y2="319.5" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="1334.3" y="394.0" width="225.0" height="38" rx="19" fill="#faf7f0" stroke="#e3dccb"/><text x="1446.8" y="420.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-weight="500">핑계로 불확실성을 선제 종료</text>
<line x1="1305.0" y1="799.5" x2="1600.6" y2="1031.0" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="1346.8" y="896.2" width="212.0" height="38" rx="19" fill="#faf7f0" stroke="#e3dccb"/><text x="1452.8" y="922.2" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-weight="500">체계적 원인 분석이 필요함</text>
<path d="M 1118.0 799.5 C 1048.0 1096.3, 1048.0 1356.0, 1118.0 1541.5" fill="none" stroke="#8a3b2b" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="902.5" y="1151.5" width="251.0" height="38" rx="19" fill="#faf7f0" stroke="#e3dccb"/><text x="1028.0" y="1177.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#8a3b2b" font-weight="500">개인 책임 vs 사회적 불공정성</text>
<g filter="url(#sh)"><rect x="128.0" y="93.5" width="540" height="323" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g><text x="398" y="255" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="24" fill="#2f4a63" font-weight="600"><tspan x="398" y="207.5">예외를 허용하면 소진된</tspan><tspan x="398" y="241.6">의지력이 편한 쪽으로</tspan><tspan x="398" y="275.6">결정을 유도하므로 예외</tspan><tspan x="398" y="309.7">자체를 차단해야 한다</tspan></text><text x="398" y="448.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-style="italic">자기계발 - 의지력</text>
<g filter="url(#sh)"><rect x="143.0" y="956.5" width="510" height="293" rx="20" fill="#faeae3" stroke="#b9694f" stroke-width="2"/></g><text x="398" y="1103" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="24" fill="#8a3b2b" font-weight="600"><tspan x="398" y="1038.4">관심없는 의무적인 일은</tspan><tspan x="398" y="1072.5">목표 없이 꾸준함만</tspan><tspan x="398" y="1106.6">유지해야 의무감으로</tspan><tspan x="398" y="1140.7">인한 포기를 막을 수</tspan><tspan x="398" y="1174.8">있다</tspan></text><text x="398" y="1281.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-style="italic">자기계발 - 습관</text>
<g filter="url(#sh)"><rect x="1500.0" y="56.5" width="510" height="263" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g><text x="1755" y="188" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="24" fill="#2f4a63" font-weight="600"><tspan x="1755" y="123.4">자이가르닉 효과는</tspan><tspan x="1755" y="157.5">완료하지 못한 일을</tspan><tspan x="1755" y="191.6">뇌가 더 강하게</tspan><tspan x="1755" y="225.7">기억하게 만드는</tspan><tspan x="1755" y="259.8">현상이다</tspan></text><text x="1755" y="351.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-style="italic">심리학 - 인지</text>
<g filter="url(#sh)"><rect x="1523.0" y="1031.0" width="510" height="278" rx="20" fill="#faeae3" stroke="#b9694f" stroke-width="2"/></g><text x="1778" y="1170" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="24" fill="#8a3b2b" font-weight="600"><tspan x="1778" y="1105.4">스트레스는 상황</tspan><tspan x="1778" y="1139.5">파악·해결방안</tspan><tspan x="1778" y="1173.6">탐색·실행이라는</tspan><tspan x="1778" y="1207.7">3단계로 다스릴 수</tspan><tspan x="1778" y="1241.8">있다</tspan></text><text x="1778" y="1341.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-style="italic">심리학 - 상담</text>
<g filter="url(#sh)"><rect x="825.5" y="1541.5" width="585" height="263" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g><text x="1118" y="1673" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="24" fill="#2f4a63" font-weight="600"><tspan x="1118" y="1625.5">롤스의 정의론은</tspan><tspan x="1118" y="1659.6">능력주의적 태도와</tspan><tspan x="1118" y="1693.6">구빈법적 사고를 극복하지</tspan><tspan x="1118" y="1727.7">못한다</tspan></text><text x="1118" y="1836.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-style="italic">정치철학 - 완전히 다른 영역</text>
<g filter="url(#sh-lg)"><rect x="825.5" y="506.5" width="585" height="293" rx="20" fill="#ffffff" stroke="#4d6f92" stroke-width="2"/></g><text x="1118" y="653" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="28" fill="#2f4a63" font-weight="700"><tspan x="1118" y="597.6">셀프 핸디캐핑은 실패를</tspan><tspan x="1118" y="637.3">미리 정당화하기 위해</tspan><tspan x="1118" y="677.1">스스로 불리한 상황을</tspan><tspan x="1118" y="716.8">만드는 심리다</tspan></text><text x="1118" y="831.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" fill="#5c5347" font-style="italic">심리학 - 방어기제</text>
<circle cx="98" cy="64" r="12" fill="#4d6f92"/><text x="124" y="72" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#5c5347">문헌노트</text>
<circle cx="320" cy="64" r="12" fill="#b9694f"/><text x="346" y="72" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" fill="#5c5347">영구노트</text>
</svg>