<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1120" width="1260" height="1120">
<defs><filter id="sh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2b2620" flood-opacity="0.15"/></filter><filter id="sh-lg" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#2b2620" flood-opacity="0.2"/></filter><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c5347"/></marker></defs>
<rect width="1260" height="1120" fill="#faf7f0"/>
<line x1="390.0" y1="237.6" x2="494.8" y2="295.0" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="389.6" y="255.3" width="105.6" height="22" rx="11" fill="#faf7f0" stroke="#e3dccb"/><text x="442.4" y="270.3" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#5c5347" font-weight="500">작은 예외가 습관화된다</text>
<line x1="230.0" y1="245.0" x2="230.0" y2="555.0" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="173.6" y="389.0" width="112.9" height="22" rx="11" fill="#faf7f0" stroke="#e3dccb"/><text x="230.0" y="404.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#5c5347" font-weight="500">예외 없는 규칙과 상보적</text>
<line x1="766.5" y1="295.0" x2="917.2" y2="185.0" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="778.1" y="229.0" width="127.5" height="22" rx="11" fill="#faf7f0" stroke="#e3dccb"/><text x="841.9" y="244.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#5c5347" font-weight="500">핑계로 불확실성을 선제 종료</text>
<line x1="757.7" y1="465.0" x2="928.7" y2="600.0" stroke="#5c5347" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="783.1" y="521.5" width="120.2" height="22" rx="11" fill="#faf7f0" stroke="#e3dccb"/><text x="843.2" y="536.5" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#5c5347" font-weight="500">체계적 원인 분석이 필요함</text>
<path d="M 650.0 465.0 C 580.0 637.0, 580.0 787.5, 650.0 895.0" fill="none" stroke="#8a3b2b" stroke-width="1.7" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="488.9" y="669.0" width="142.1" height="22" rx="11" fill="#faf7f0" stroke="#e3dccb"/><text x="560.0" y="684.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#8a3b2b" font-weight="500">개인 책임 vs 사회적 불공정성</text>
<g filter="url(#sh)"><rect x="70.0" y="55.0" width="320" height="190" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g><text x="230" y="150" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="13.5" fill="#2f4a63" font-weight="600"><tspan x="230" y="123.3">예외를 허용하면 소진된</tspan><tspan x="230" y="142.4">의지력이 편한 쪽으로</tspan><tspan x="230" y="161.6">결정을 유도하므로 예외</tspan><tspan x="230" y="180.8">자체를 차단해야 한다</tspan></text>
<g filter="url(#sh)"><rect x="80.0" y="555.0" width="300" height="170" rx="20" fill="#faeae3" stroke="#b9694f" stroke-width="2"/></g><text x="230" y="640" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="13.5" fill="#8a3b2b" font-weight="600"><tspan x="230" y="613.3">관심없는 의무적인 일은</tspan><tspan x="230" y="632.4">목표 없이 꾸준함만</tspan><tspan x="230" y="651.6">유지해야 의무감으로 인한</tspan><tspan x="230" y="670.8">포기를 막을 수 있다</tspan></text>
<g filter="url(#sh)"><rect x="870.0" y="35.0" width="300" height="150" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g><text x="1020" y="110" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="13.5" fill="#2f4a63" font-weight="600"><tspan x="1020" y="83.3">자이가르닉 효과는</tspan><tspan x="1020" y="102.4">완료하지 못한 일을 뇌가</tspan><tspan x="1020" y="121.6">더 강하게 기억하게</tspan><tspan x="1020" y="140.8">만드는 현상이다</tspan></text>
<g filter="url(#sh)"><rect x="880.0" y="600.0" width="300" height="160" rx="20" fill="#faeae3" stroke="#b9694f" stroke-width="2"/></g><text x="1030" y="680" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="13.5" fill="#8a3b2b" font-weight="600"><tspan x="1030" y="653.3">스트레스는 상황</tspan><tspan x="1030" y="672.4">파악·해결방안</tspan><tspan x="1030" y="691.6">탐색·실행이라는 3단계로</tspan><tspan x="1030" y="710.8">다스릴 수 있다</tspan></text>
<g filter="url(#sh)"><rect x="480.0" y="895.0" width="340" height="150" rx="20" fill="#e4edf5" stroke="#4d6f92" stroke-width="2"/></g><text x="650" y="970" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="13.5" fill="#2f4a63" font-weight="600"><tspan x="650" y="952.9">롤스의 정의론은 능력주의적</tspan><tspan x="650" y="972.0">태도와 구빈법적 사고를</tspan><tspan x="650" y="991.2">극복하지 못한다</tspan></text><text x="650" y="1063.0" text-anchor="middle" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" fill="#5c5347" font-style="italic">정치철학 - 완전히 다른 영역</text>
<g filter="url(#sh-lg)"><rect x="480.0" y="295.0" width="340" height="170" rx="20" fill="#ffffff" stroke="#4d6f92" stroke-width="2"/></g><text x="650" y="380" text-anchor="middle" font-family="'Noto Serif KR','Malgun Gothic',serif" font-size="15.5" fill="#2f4a63" font-weight="700"><tspan x="650" y="349.3">셀프 핸디캐핑은 실패를</tspan><tspan x="650" y="371.3">미리 정당화하기 위해</tspan><tspan x="650" y="393.3">스스로 불리한 상황을</tspan><tspan x="650" y="415.3">만드는 심리다</tspan></text>
<circle cx="60" cy="40" r="7" fill="#4d6f92"/><text x="76" y="45" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" fill="#5c5347">문헌노트</text>
<circle cx="190" cy="40" r="7" fill="#b9694f"/><text x="206" y="45" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" fill="#5c5347">영구노트</text>
</svg>